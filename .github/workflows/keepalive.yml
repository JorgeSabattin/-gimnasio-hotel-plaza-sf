yaml
name: Supabase keep-alive

on:
  schedule:
    - cron: "0 12 */3 * *"   # cada 3 días, ~09:00 hora Chile
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta liviana a Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/kv?select=key&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "HTTP $code"
          if [ "$code" -ge 500 ] || [ "$code" = "000" ]; then exit 1; fi
