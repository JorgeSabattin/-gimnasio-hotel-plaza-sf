name: Supabase keep-alive
on:
  schedule:
    - cron: "0 12 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta liviana a Supabase
        run: curl -s -w "\nHTTP %{http_code}\n" "${{ secrets.SUPABASE_URL }}/rest/v1/kv?select=key&limit=1" -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
